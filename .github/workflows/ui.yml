name: UI Tests

# Runs the full UI suite on Chromium on every push / PR and on manual trigger.
on:
  push:
    paths:
      - 'tests/e2e/**'
      - '!tests/e2e/api/**'
      - 'playwright.config.ts'
      - 'package*.json'
      - '.github/workflows/ui.yml'
  pull_request:
    paths:
      - 'tests/e2e/**'
      - '!tests/e2e/api/**'
      - 'playwright.config.ts'
      - 'package*.json'
      - '.github/workflows/ui.yml'
  workflow_dispatch:

jobs:
  # ── 1. Run the UI suite on Chromium ──────────────────────────────────────
  test:
    name: UI test suite (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npx playwright test --project=setup --project=chromium
        env:
          CI: 'true'
          BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://automationexercise.com' }}
          TEST_USER_EMAIL: ${{ vars.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ vars.TEST_USER_PASSWORD }}

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: playwright-report/
          retention-days: 2

      - name: Prepare Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/